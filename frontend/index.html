<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Make the app responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page title shown in the browser tab -->
    <title>Smart Disaster Response Platform</title>

    <!-- Favicon using an SVG emoji data URI — no extra image file needed -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚨</text></svg>"
    />

    <!-- Meta description for search engines / social sharing -->
    <meta
      name="description"
      content="Smart Disaster Response and Relief Coordination Platform — connecting volunteers, NGOs, citizens and donors in times of crisis."
    />
  </head>
  <body>
    <!-- React mounts the entire application inside this single div -->
    <div id="root"></div>

    <!-- Vite entry point — React bootstraps from src/main.jsx -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
